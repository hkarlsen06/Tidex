# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "tidex"

[setup]
script = '''
set -euo pipefail

SOURCE_ROOT="$(pwd)"
WORKTREE_ROOT="${CODEX_WORKTREE_PATH:?CODEX_WORKTREE_PATH is not set}"

copy_file() {
  local rel="$1"
  if [ -f "$SOURCE_ROOT/$rel" ]; then
    mkdir -p "$WORKTREE_ROOT/$(dirname "$rel")"
    cp -p "$SOURCE_ROOT/$rel" "$WORKTREE_ROOT/$rel"
  fi
}

copy_dir() {
  local rel="$1"
  if [ -d "$SOURCE_ROOT/$rel" ]; then
    mkdir -p "$WORKTREE_ROOT/$(dirname "$rel")"
    rm -rf "$WORKTREE_ROOT/$rel"
    cp -pR "$SOURCE_ROOT/$rel" "$WORKTREE_ROOT/$rel"
  fi
}

# Local env / secrets
for file in \
  .env \
  .env.local \
  .env.development.local \
  .npmrc \
  ios/.env \
  ios/.env.local \
  ios/.env.local.sh \
  ios/BuildNumber.xcconfig \
  supabase/.env.keys \
  supabase/.env.local
do
  copy_file "$file"
done

# Supabase CLI link state
copy_dir supabase/.branches
copy_dir supabase/.temp

# Optional local signing/cert material if present
copy_dir certificates

# Make the local Chat fork available as ../Chat for iOS worktrees.
if [ -d "$SOURCE_ROOT/../Chat/.git" ] && [ ! -e "$WORKTREE_ROOT/../Chat" ]; then
  ln -s "$SOURCE_ROOT/../Chat" "$WORKTREE_ROOT/../Chat"
fi

cd "$WORKTREE_ROOT"

bun install --frozen-lockfile

if [ -d "$WORKTREE_ROOT/../Chat/.git" ]; then
  ./scripts/set-chat-package-source.sh local
fi
'''

[cleanup]
script = '''
set -euo pipefail

WORKTREE_ROOT="${CODEX_WORKTREE_PATH:-$(pwd)}"

rm -rf \
  "$WORKTREE_ROOT/node_modules" \
  "$WORKTREE_ROOT/marketing/.next" \
  "$WORKTREE_ROOT/dev-site/.next" \
  "$WORKTREE_ROOT/ios/build" \
  "$WORKTREE_ROOT/supabase/functions/node_modules"
'''
