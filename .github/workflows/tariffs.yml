name: Tariff catalogue

on:
  pull_request:
    paths:
      - "backend/**"
      - "ios/TidexApp/Storage/Testing/TariffCatalogueFixture.json"
      - ".github/workflows/tariffs.yml"
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 * *"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install backend dependencies
        run: bun install --cwd backend --frozen-lockfile
      - name: Type-check backend
        run: bun run --cwd backend typecheck
      - name: Verify catalogue and payroll behavior
        run: bun test backend/scripts
      - name: Validate reviewed rates
        run: bun backend/scripts/tariffs.ts validate
      - name: Report agreements due for source review
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bun backend/scripts/tariffs.ts review
