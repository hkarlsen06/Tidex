name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: |
          pnpm add --filter next "https://api.motion.dev/registry.tgz?package=motion-plus&version=2.8.0&token=$MOTION_PLUS_ACCESS_TOKEN"
          pnpm install
        env:
          MOTION_PLUS_ACCESS_TOKEN: ${{ secrets.MOTION_PLUS_ACCESS_TOKEN }}
      - run: pnpm lint
        id: lint

      - name: notify vercel success
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint.outcome == 'success'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - tidex: ci"
          state: success

      - name: notify vercel failure
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.lint.outcome == 'failure'
        uses: vercel/repository-dispatch/actions/status@v1
        with:
          name: "Vercel - tidex: ci"
          state: failure
