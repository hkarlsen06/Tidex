name: Smoke

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    name: Checks
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install SwiftLint
        run: |
          if ! command -v swiftlint >/dev/null 2>&1; then
            brew install swiftlint
          fi

      - name: Check Chat package source
        run: bun run ios:chat-package:check

      - name: Report size hotspots
        run: bun run maint:size-hotspots

      - name: Type-check web surfaces
        run: bun run lint

      - name: Lint Swift
        run: bun run swiftlint -- --quiet

      - name: Validate iOS localization
        run: bun run ios:l10n:validate

      - name: Audit iOS localization
        run: bun run ios:l10n:audit
