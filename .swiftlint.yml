# SwiftLint configuration for all Swift in the Tidex monorepo.
#
# Every non-conflicting lint rule is enabled. Existing debt is recorded in the
# baseline; new warnings are errors. Source formatting remains owned by
# swift-format so the two tools do not compete over layout.

included:
  - ios

excluded:
  - ios/Scripts/.build
  - ios/Pods
  - ios/DerivedData
  - ios/.build
  - ios/vendor
  - ios/TidexApp/Generated

baseline: .swiftlint-baseline.json
strict: true
reporter: xcode

opt_in_rules:
  - all

analyzer_rules:
  - all

disabled_rules:
  # swift-format is the repository's formatting authority.
  - attributes
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - contrasted_opening_brace
  - implicit_return
  - indentation_width
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiple_closures_with_trailing_closure
  - opening_brace
  - operator_usage_whitespace
  - period_spacing
  - statement_position
  - trailing_closure
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # Mutually exclusive policies; use the stricter selected counterpart.
  - no_extension_access_modifier
  - object_literal
  - redundant_type_annotation

  # Project architecture intentionally permits declarations grouped by feature.
  - one_declaration_per_file

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: error

closure_body_length:
  warning: 30
  error: 60

cyclomatic_complexity:
  warning: 8
  error: 12
  ignores_case_statements: false

enum_case_associated_values_count:
  warning: 4
  error: 5

file_length:
  warning: 400
  error: 600
  ignore_comment_only_lines: true

function_body_length:
  warning: 40
  error: 70

function_parameter_count:
  warning: 5
  error: 7
  ignores_default_parameters: true

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - x
    - y
  validates_start_with_lowercase: error
  unallowed_symbols_severity: error

large_tuple:
  warning: 2
  error: 3

line_length:
  warning: 120
  error: 160
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: false
  ignores_multiline_strings: false

nesting:
  type_level:
    warning: 2
    error: 3
  function_level:
    warning: 2
    error: 3
  check_nesting_in_closures_and_statements: true
  ignore_coding_keys: true

type_body_length:
  warning: 250
  error: 400

type_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  validates_start_with_lowercase: error
  unallowed_symbols_severity: error

vertical_whitespace:
  max_empty_lines: 1

blanket_disable_command:
  severity: error
  allowed_rules: []
  always_blanket_disable: []

invalid_swiftlint_command:
  severity: error

superfluous_disable_command:
  severity: error

custom_rules:
  no_raw_localization_keys:
    name: Raw localization key
    regex: '(String\(localized:|LocalizedStringResource\(|NSLocalizedString\(|Text\()[ \t]*"[a-z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+\"'
    message: Use the generated LocalizedStringResource symbol instead of a raw localization key.
    severity: error

  no_direct_print:
    name: Direct print
    regex: '(?<![A-Za-z0-9_])print\s*\('
    message: Use the project logging or diagnostics infrastructure instead of print().
    severity: error
