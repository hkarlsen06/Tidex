# SwiftLint configuration for Tidex monorepo iOS code.
# Formatter style is delegated to swift-format; SwiftLint focuses on code quality.

included:
  - ios

excluded:
  - ios/Scripts/.build
  - ios/Pods
  - ios/DerivedData
  - ios/.build
  - ios/vendor
  - next
  - marketing
  - dev-site

opt_in_rules:
  # Bug-catching rules
  - async_without_await
  - discarded_notification_center_observer
  - identical_operands
  - overridden_super_call
  - override_in_extension
  - unowned_variable_capture
  - weak_delegate
  - private_action
  - private_outlet
  - yoda_condition
  - lower_acl_than_parent
  - unavailable_function
  - force_unwrapping
  - implicitly_unwrapped_optional

  # Performance / quality rules with low false-positive rates
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  - sorted_first_last
  - array_init
  - fatal_error_message
  - legacy_multiple
  - legacy_random
  - prefer_zero_over_explicit_init
  - toggle_bool
  - self_binding

disabled_rules:
  # Metrics - too strict for existing codebase
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity

  # Formatter-managed style rules (swift-format is source of truth)
  - opening_brace
  - trailing_whitespace
  - trailing_comma
  - trailing_closure
  - trailing_newline
  - multiple_closures_with_trailing_closure
  - implicit_return
  - statement_position
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - multiline_arguments
  - multiline_parameters
  - multiline_function_chains
  - multiline_literal_brackets
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - period_spacing
  - closure_parameter_position

  # Existing codebase conventions
  - nesting
  - identifier_name
  - large_tuple
  - explicit_acl
  - explicit_top_level_acl
  - explicit_type_interface
  - missing_docs
  - file_name
  - attributes
  - sorted_imports
  - type_contents_order
  - indentation_width
  - redundant_type_annotation
  - redundant_discardable_let
  - implicit_optional_initialization
  - unused_closure_parameter
  - shorthand_optional_binding
  - legacy_objc_type
  - redundant_nil_coalescing

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: warning

function_parameter_count:
  warning: 6
  error: 8

type_name:
  min_length: 2
  max_length: 50

vertical_whitespace:
  max_empty_lines: 2

reporter: "xcode"
