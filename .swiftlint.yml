# SwiftLint configuration for all Swift in the Tidex monorepo.
#
# High-signal lint rules are enabled. Existing debt is recorded in the baseline.
# Source formatting remains owned by swift-format so the two tools do not
# compete over layout.

included:
  - ios

excluded:
  - ios/Scripts/.build
  - ios/Pods
  - ios/DerivedData
  - ios/.build
  - ios/Vendor
  - ios/TidexApp/Generated

baseline: .swiftlint-baseline.json
# Baseline note, 2026-06-11: lifted the prior strict posture by removing
# `strict: true`, `opt_in_rules: all`, and `analyzer_rules: all`. The noisiest
# rule families now left to the baseline history instead of active linting are:
# explicit_acl, explicit_top_level_acl, explicit_type_interface,
# no_magic_numbers, type_contents_order, file_types_order,
# conditional_returns_on_newline, multiline_arguments_brackets,
# multiline_call_arguments, anonymous_argument_in_multiline_closure,
# sorted_enum_cases, explicit_enum_raw_value, required_deinit,
# prefer_nimble, single_test_class, balanced_xctest_lifecycle,
# xct_specific_matcher, discouraged_optional_boolean,
# discouraged_optional_collection, no_grouping_extension,
# strict_fileprivate, prefixed_toplevel_constant, legacy_objc_type,
# pattern_matching_keywords, raw_value_for_camel_cased_codable_enum,
# prefer_asset_symbols, let_var_whitespace, sorted_imports,
# shorthand_argument, convenience_type, no_empty_block, and file_name.
# The strict metric error thresholds are also lifted to warning-only for:
# closure_body_length, cyclomatic_complexity, enum_case_associated_values_count,
# file_length, function_body_length, function_parameter_count, large_tuple,
# nesting, type_body_length, line_length, identifier_name, and type_name.
reporter: xcode

opt_in_rules:
  - accessibility_label_for_image
  - accessibility_trait_for_button
  - array_init
  - async_without_await
  - closure_body_length
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - discarded_notification_center_observer
  - empty_count
  - empty_string
  - enum_case_associated_values_count
  - fallthrough
  - fatal_error_message
  - first_where
  - force_unwrapping
  - last_where
  - legacy_random
  - number_separator
  - overridden_super_call
  - private_action
  - private_outlet
  - prohibited_super_call
  - redundant_nil_coalescing
  - toggle_bool
  - unavailable_function

analyzer_rules:
  - unused_declaration
  - unused_import

disabled_rules:
  # swift-format is the repository's formatting authority.
  - attributes
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - collection_alignment
  - contrasted_opening_brace
  - implicit_return
  - indentation_width
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - multiple_closures_with_trailing_closure
  - opening_brace
  - operator_usage_whitespace
  - period_spacing
  - statement_position
  - trailing_closure
  - trailing_comma
  - trailing_newline
  - trailing_whitespace
  - vertical_whitespace_closing_braces
  - vertical_whitespace_opening_braces

  # Mutually exclusive policies; use the stricter selected counterpart.
  - no_extension_access_modifier
  - object_literal
  - redundant_type_annotation

  # Project architecture intentionally permits declarations grouped by feature.
  - one_declaration_per_file

force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: error

closure_body_length:
  warning: 30

cyclomatic_complexity:
  warning: 8
  ignores_case_statements: false

enum_case_associated_values_count:
  warning: 4

file_length:
  warning: 400
  ignore_comment_only_lines: true

function_body_length:
  warning: 40

function_parameter_count:
  warning: 5
  ignores_default_parameters: true

identifier_name:
  min_length:
    warning: 2
  max_length:
    warning: 40
  excluded:
    - id
    - x
    - y

large_tuple:
  warning: 2

line_length:
  warning: 120
  ignores_urls: true
  ignores_comments: false
  ignores_interpolated_strings: false
  ignores_multiline_strings: false

nesting:
  type_level:
    warning: 2
  function_level:
    warning: 2
  check_nesting_in_closures_and_statements: true
  ignore_coding_keys: true

type_body_length:
  warning: 250

type_name:
  min_length:
    warning: 2
  max_length:
    warning: 40

vertical_whitespace:
  max_empty_lines: 1

blanket_disable_command:
  severity: error
  allowed_rules: []
  always_blanket_disable: []

invalid_swiftlint_command:
  severity: error

superfluous_disable_command:
  severity: error

custom_rules:
  no_raw_localization_keys:
    name: Raw localization key
    regex: '(String\(localized:|LocalizedStringResource\(|NSLocalizedString\(|Text\()[ \t]*"[a-z][A-Za-z0-9]*(\.[A-Za-z0-9]+)+\"'
    message: Use the generated LocalizedStringResource symbol instead of a raw localization key.
    severity: error

  no_bare_destructive_swipe_action:
    name: Bare destructive swipe action
    regex: '\.swipeActions[^{]*\{[^}]*role:\s*\.destructive'
    excluded_match_kinds: [comment, doccomment]
    message: Use SwipeDeleteButton. Swipe buttons take any inherited tint, even with a destructive role.
    severity: error

  no_direct_print:
    name: Direct print
    regex: '(?<![A-Za-z0-9_])print\s*\('
    message: Use the project logging or diagnostics infrastructure instead of print().
    severity: error
