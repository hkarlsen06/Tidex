# SwiftLint configuration for Tidex iOS app
# STRICT MODE - Catches real bugs, not just style issues

# Paths to include
included:
  - Native

# Paths to exclude
excluded:
  - Pods
  - DerivedData
  - .build
  - vendor

# Opt-in rules - enable all bug-catching and performance rules
opt_in_rules:
  # Bug-catching rules (CRITICAL)
  - async_without_await              # Catches async functions without await
  - discarded_notification_center_observer  # Memory leaks from NotificationCenter
  - identical_operands               # Logic errors like x == x
  - overridden_super_call            # Missing super calls
  - override_in_extension            # Overrides in extensions can be problematic
  - unowned_variable_capture         # Potential crashes from unowned
  - weak_delegate                    # Delegates should be weak
  - private_action                   # IBActions should be private
  - private_outlet                   # IBOutlets should be private
  - yoda_condition                   # Catches assignment in conditionals
  - lower_acl_than_parent            # Access control issues

  # Performance rules
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - contains_over_range_nil_comparison
  - empty_collection_literal
  - empty_count
  - empty_string
  - first_where
  - flatmap_over_map_reduce
  - last_where
  - reduce_into
  - sorted_first_last

  # Code quality rules
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - enum_case_associated_values_count
  - fatal_error_message
  - force_unwrapping                 # Catches potential crashes
  - implicitly_unwrapped_optional    # IUOs are dangerous
  - legacy_multiple
  - legacy_random
  - literal_expression_end_indentation
  - modifier_order
  - operator_usage_whitespace
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - redundant_nil_coalescing
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unavailable_function
  - self_binding
  - period_spacing

# Disabled rules - only disable what's truly necessary
disabled_rules:
  # Metrics - these are too strict for real code
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity

  # Style preferences that don't catch bugs
  - trailing_whitespace
  - trailing_comma
  - trailing_closure
  - trailing_newline
  - multiple_closures_with_trailing_closure
  - implicit_return
  - statement_position
  - vertical_whitespace_opening_braces
  - vertical_whitespace_closing_braces
  - multiline_arguments
  - multiline_parameters
  - multiline_function_chains
  - multiline_literal_brackets

  # Too strict for existing codebase
  - nesting                          # SwiftUI requires nested views
  - identifier_name                  # Too strict for 'id', 'x', 'y'
  - large_tuple
  - explicit_acl
  - explicit_top_level_acl
  - explicit_type_interface
  - missing_docs
  - file_name
  - attributes
  - sorted_imports
  - type_contents_order
  - indentation_width

  # Existing code patterns
  - redundant_type_annotation
  - redundant_discardable_let
  - implicit_optional_initialization
  - unused_closure_parameter
  - shorthand_optional_binding    # Too noisy - existing code uses `if let x = x` pattern
  - legacy_objc_type              # NSNumber etc. are fine in some contexts

# Rule configurations - make errors more strict
force_cast:
  severity: error

force_try:
  severity: error

force_unwrapping:
  severity: warning  # warning because sometimes it's intentional

function_parameter_count:
  warning: 6
  error: 8

type_name:
  min_length: 2
  max_length: 50

vertical_whitespace:
  max_empty_lines: 2

# Reporter type
reporter: "xcode"
