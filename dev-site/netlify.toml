[build]
  base = "dev-site"
  command = "npm install && npm run build"
  publish = "out"

# Node.js version for build
[build.environment]
  NODE_VERSION = "20"

# Ensure clean builds
[build.processing]
  skip_processing = false

# Optional: Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA fallback for client-side routing (if needed)
# Since this is static export with locale routing, we want to serve the actual HTML files
# No fallback redirect needed as Next.js static export handles this

# Redirect www to non-www (optional, configure if you want www.kkarlsen.dev -> kkarlsen.dev)
# [[redirects]]
#   from = "https://www.kkarlsen.dev/*"
#   to = "https://kkarlsen.dev/:splat"
#   status = 301
#   force = true
