[build]
  base = "."
  command = "npm ci --include=dev && npm run --workspace marketing build"
  publish = "marketing/out"

# Domain redirects (308 = Permanent Redirect preserving HTTP method)
# Note: kkarlsen.dev is now deployed separately as dev-site portfolio
[[redirects]]
  from = "https://kkarlsen.art/*"
  to = "https://www.tidex.no/:splat"
  status = 308
  force = true

